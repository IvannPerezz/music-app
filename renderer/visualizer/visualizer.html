<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <!-- Runs inside a sandboxed iframe (opaque origin, no access to the app), served by the local
       proxy at /vis/. Butterchurn builds each MilkDrop preset's equations with new Function, so
       only this page allows eval. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src http://127.0.0.1:* 'unsafe-eval'; img-src data: blob:; style-src 'unsafe-inline'" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script src="vendor/butterchurn.min.js"></script>
  <script src="vendor/butterchurnExtraImages.min.js"></script>
  <script src="vendor/butterchurnPresets.min.js"></script>
  <script src="vendor/butterchurnPresetsExtra.min.js"></script>
  <script src="vis.js"></script>
</body>
</html>
